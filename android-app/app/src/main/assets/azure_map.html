<!DOCTYPE html>
<html lang="en">
<head>
    <title>Azure Maps</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.css" type="text/css"/>
    <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js"></script>
    <style>
        html, body, #map { margin: 0; height: 100%; width: 100%; background-color: #f0f0f0; }
        body { display: flex; flex-direction: column; }
        main { flex: 1 1 auto; }
    </style>
    <script type="text/javascript">
        var map = null;
        var mapReady = false;
        var userMarker = null;
        var destinationMarker = null;
        var poiDatasource = null;
        var poiLayer = null;
        var secondaryRouteDatasource = null;
        var datasource = null; // For actual route
        var plannedDatasource = null; // For suggested route
        var routePath = [];
        var lastLat, lastLng, lastZoom;
        var lastRouteUpdateTime = 0;
        var minDistanceThreshold = 5;
        var potholeDatasource = null;
        var potholeLayer = null;

        function waitForDimensions(callback) {
            var el = document.getElementById("map");
            if (!el) {
                setTimeout(function() { waitForDimensions(callback); }, 100);
                return;
            }
            var h = el.clientHeight || el.offsetHeight;
            var w = el.clientWidth || el.offsetWidth;
            if (h > 0 && w > 0) {
                callback();
            } else {
                setTimeout(function() { waitForDimensions(callback); }, 100);
            }
        }

        function calculateDistance(pos1, pos2) {
            var earthRadius = 6371e3; // meters
            var dLat = (pos2[1] - pos1[1]) * Math.PI / 180;
            var dLon = (pos2[0] - pos1[0]) * Math.PI / 180;
            var angularDistanceFactor = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(pos1[1] * Math.PI / 180) * Math.cos(pos2[1] * Math.PI / 180) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return earthRadius * 2 * Math.atan2(Math.sqrt(angularDistanceFactor), Math.sqrt(1 - angularDistanceFactor));
        }

        function updateMarker(lat, lng) {
            if (!map) return;
            var latN = Number(lat), lngN = Number(lng);
            if(!Number.isFinite(latN) || !Number.isFinite(lngN)) return;

            var pos = [lngN, latN];

            if (!userMarker) {
                userMarker = new atlas.HtmlMarker({
                    htmlContent: '<div style="background-color:Red;width:15px;height:15px;border-radius:50%;border:2px solid white;box-shadow:0 0 5px rgba(0,0,0,0.5);"></div>',
                    position: pos
                });
                map.markers.add(userMarker);
            } else {
                userMarker.setOptions({ position: pos });
            }
        }

        window.setNearbyPois = function(poisJson) {
            if(!map || !poiDatasource) return;

            try{
                var pois = JSON.parse(poisJson);
                var features = pois.map(function(poi) {
                    return new atlas.data.Feature(new atlas.data.Point([poi.longitude, poi.latitude]),  {
                        name: poi.name,
                        category: poi.category ?? ""
                    });
                });
                poiDatasource.setShapes(features);
            } catch(e){
                console.error("JS: Error parsing POIs: " + e.message);
            }
        };

        window.setPotholes = function(potholesJson){
            if(!map || !potholeDatasource) return;
            try{
                var defects = JSON.parse(potholesJson);
                var features = defects.map(function(d){
                    return new atlas.data.Feature(
                        new atlas.data.Point([d.lng, d.lat]),
                        {
                            title: 'Pothole (' + (d.reports || 3) + ' reports)',
                            severity: d.avg_severity || d.avgSeverity || 0
                        }
                    );
                });
                potholeDatasource.setShapes(features);
            }catch(e){
                console.error("JS: Error parsing potholes: " + e.message);
            }
        };

        window.clearPotholes = function(){
            if(potholeDatasource){
                potholeDatasource.clear();
            }
        };

        window.setDestination = function(lat, lng) {
            if (!map) return;
            var latN = Number.parseFloat(lat), lngN = Number.parseFloat(lng);
            if(!Number.isFinite(latN) || !Number.isFinite(lngN)) return;

            var pos = [lngN, latN];
            if (!destinationMarker) {
                destinationMarker = new atlas.HtmlMarker({
                    htmlContent: '<div style="background-color:Green;width:15px;height:15px;border-radius:50%;border:2px solid white;box-shadow:0 0 5px rgba(0,0,0,0.5);"></div>',
                    position: pos
                });
                map.markers.add(destinationMarker);
            } else {
                destinationMarker.setOptions({ position: pos });
            }
        };

        window.setPlannedRoute = function(pointsJson) {
            if (!plannedDatasource) return;
            try {
                var points = JSON.parse(pointsJson);
                var path = points.map(function(p) { return [p.lng, p.lat]; });
                plannedDatasource.setShapes([new atlas.data.LineString(path)]);
            } catch (e) {
                console.error("JS: Error parsing planned route: " + e.message);
            }
        };

        function updateRoute(lat, lng) {
            if (!datasource) return;
            var pos = [Number.parseFloat(lng), Number.parseFloat(lat)];
            var shouldAddPoint = routePath.length === 0 ||
                                calculateDistance(routePath[routePath.length - 1], pos) > minDistanceThreshold;

            if (shouldAddPoint) {
                routePath.push(pos);
                var now = Date.now();
                if (routePath.length > 1 && (now - lastRouteUpdateTime > 1000)) {
                    datasource.setShapes([new atlas.data.LineString(routePath)]);
                    lastRouteUpdateTime = now;
                }
            }
        }

        //  Updated setHotspots to ensure it matches Kotlin data keys
        var hotspotDatasource = null;
        window.setHotspots = function(eventsJson) {
            if (!map || !hotspotDatasource) return;
            try {
                var events = JSON.parse(eventsJson);
                var features = events.map(function(e) {
                    if (e.longitude == null || e.latitude == null) return null;
                    return new atlas.data.Feature(new atlas.data.Point([e.longitude, e.latitude]), {
                        // Match 'event_type' from Kotlin DTO
                        type: e.event_type
                    });
                }).filter(function(f) { return f != null; });
                hotspotDatasource.setShapes(features);
            } catch (e) {
                console.error("JS: Error parsing hotspots: " + e.message);
            }
        };

        window.initializeMap = function(subscriptionKey, lat, lng, zoom) {
            waitForDimensions(function() {
                try {
                    map = new atlas.Map("map", {
                        center: [Number.parseFloat(lng), Number.parseFloat(lat)],
                        zoom: Number.parseFloat(zoom),
                        authOptions: { authType: "subscriptionKey", subscriptionKey: subscriptionKey }
                    });

                    map.events.add("ready", function () {
                        map.resize();

                        // INITIALIZE HOTSPOT DATA SOURCE
                        hotspotDatasource = new atlas.source.DataSource();
                        map.sources.add(hotspotDatasource);

                        // MOVED BUBBLE LAYER INSIDE READY BLOCK
                        map.layers.add(new atlas.layer.BubbleLayer(hotspotDatasource, null, {
                            color: [
                                'match',
                                ['get', 'type'],
                                'HARSH_ACCELERATION', 'Red',
                                'HARSH_BRAKE', 'Purple',
                                'Cyan'
                            ],
                            radius: 12,
                            opacity: 0.6,
                            strokeColor: 'white',
                            strokeWidth: 2
                        }));

                        // Suggested Route
                        plannedDatasource = new atlas.source.DataSource();
                        map.sources.add(plannedDatasource);
                        map.layers.add(new atlas.layer.LineLayer(plannedDatasource, null, {
                            strokeColor: '#A0CFFF',
                            strokeWidth: 6,
                            lineJoin: 'round',
                            lineCap: 'round'
                        }));

                        // Actual Route
                        datasource = new atlas.source.DataSource();
                        map.sources.add(datasource);
                        map.layers.add(new atlas.layer.LineLayer(datasource, null, {
                            strokeColor: '#2D8CFF',
                            strokeWidth: 5,
                            lineJoin: 'round',
                            lineCap: 'round'
                        }));

                        poiDatasource = new atlas.source.DataSource();
                        map.sources.add(poiDatasource);
                        poiLayer = new atlas.layer.SymbolLayer(poiDatasource, null, {
                            iconOptions: { image: 'pin-blue', allowOverlap: true },
                            textOptions: { textField: ['get', 'name'], offset: [0, 1.2], size: 12 }
                        });
                        map.layers.add(poiLayer);

                        potholeDatasource = new atlas.source.DataSource();
                        map.sources.add(potholeDatasource);
                        potholeLayer = new atlas.layer.SymbolLayer(potholeDatasource, null, {
                            iconOptions: {
                                image: 'pin-red',
                                allowOverlap: true
                            },
                            textOptions: {
                                textField: ['get', 'title'],
                                offset: [0, 1.2],
                                size: 11
                            }
                        });
                        map.layers.add(potholeLayer);

                        secondaryRouteDatasource = new atlas.source.DataSource();
                        map.sources.add(secondaryRouteDatasource);
                        map.layers.add(new atlas.layer.LineLayer(secondaryRouteDatasource, null, {
                            strokeColor: '#FFA500',
                            strokeWidth: 5,
                            lineJoin: 'round'
                        }));

                        map.events.add('click', poiLayer, function (e) {
                            if(e.shapes && e.shapes.length > 0){
                                var properties  = e.shapes[0].getProperties();
                                var position  = e.shapes[0].getCoordinates();
                                if(window.Android) window.Android.onPoiClick(properties.name, position[1], position[0]);
                            }
                        });

                        updateMarker(lat, lng);
                        if (window.Android) { window.Android.onMapReady(); }
                    });

                    map.events.add('idle', function () {
                        if (!mapReady) {
                            mapReady = true;
                            if (window.Android) { window.Android.onMapStable(); }
                        }
                    });

                    map.events.add('error', function (e) {
                        if (window.Android) { window.Android.onMapError(e.error ? e.error.message : 'Map error'); }
                    });
                } catch (e) {
                    if (window.Android) { window.Android.onMapError('Init exception: ' + e.message); }
                }
            });
        };
        window.setActualRoute = function(pointsJson) {
            if (!datasource) return;
            try {
                var points = JSON.parse(pointsJson);

                routePath = points.map(function(p) { return [p.lng, p.lat]; });

                if (routePath.length > 0) {
                    // Immediately draw the line on the map
                    datasource.setShapes([new atlas.data.LineString(routePath)]);
                    // Update lastLat/lastLng so the red dot and camera are in sync
                    var lastPoint = routePath[routePath.length - 1];
                    lastLng = lastPoint[0];
                    lastLat = lastPoint[1];
                }
            } catch (e) {
                console.error("JS: Error parsing actual route: " + e.message);
            }
        };

        window.setDetourRoute = function(pointsJson) {
            if(!secondaryRouteDatasource) return;

            var points = JSON.parse(pointsJson);
            var path = points.map(function(p) { return [p.lng, p.lat]; });
            secondaryRouteDatasource.setShapes([new atlas.data.LineString(path)]);
        };

        window.updateUserLocation = function(lat, lng) {
            var latN = Number.parseFloat(lat), lngN = Number.parseFloat(lng);
            if (!Number.isFinite(latN) || !Number.isFinite(lngN)) return;

            updateMarker(latN, lngN);
            updateRoute(latN, lngN);
            lastLat = latN; lastLng = lngN;
        };

        window.centerOnUser = function(zoom) {
            if (!map || !mapReady || !Number.isFinite(lastLat)) return;
            try {
                map.setCamera({
                    center: [lastLng, lastLat],
                    zoom: zoom || 15,
                    type: 'jump'
                });
            } catch (e) {}
        };

        window.updateCamera = function(lat, lng, zoom) {
            if(!map || !mapReady) return;

            try{
                map.setCamera({
                    center: [Number.parseFloat(lng), Number.parseFloat(lat)],
                    zoom: zoom || map.getCamera().zoom,
                    type: 'ease',
                    duration: 1000
                });
            } catch (e){
                console.error("JS: Error updating camera: " + e.message);
            }
        }

    </script>
</head>
<body>
<main><div id="map"></div></main>
</body>
</html>
