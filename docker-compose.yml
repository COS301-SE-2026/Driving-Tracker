services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  prisma-migrate:
    build:
      context: ./backend
      target: builder
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    command: sh -lc "yarn prisma:migrate:deploy && yarn prisma:generate"
    restart: "no"

  seed:
    build: ./backend
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully
    command: sh -lc "/app/node_modules/.bin/tsx prisma/seed.ts"
    restart: "no"

  api:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully

  studio:
    build: ./backend
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully
    ports:
      - "5556:5555"
    command: sh -lc 'until pg_isready -h db -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 1; done; exec ./node_modules/.bin/prisma studio --port 5555 --browser none --url "$DATABASE_URL"'
    restart: "no"

  migrate-dev:
    build:
      context: ./backend
      target: builder
    volumes:
      - ./backend/prisma:/app/prisma
    env_file:
      - .env
    environment:
      - MIGRATION_NAME
    depends_on:
      db:
        condition: service_healthy
    command: sh -lc 'until pg_isready -h db -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 1; done; yarn prisma migrate dev --name "${MIGRATION_NAME:-init}"'
    restart: "no"

  frontend:
    build:
        context: ./frontend
        args:
          NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
        - "3001:3001"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
        - api
    environment:
        PORT: 3001
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

volumes:
  postgres_data:
