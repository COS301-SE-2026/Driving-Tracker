services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  prisma-migrate:
    build:
      context: ./backend
      target: builder
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    command: sh -lc "yarn prisma:migrate:deploy && yarn prisma:generate"
    restart: "no"

  seed:
    build: 
      context: ./backend
      target: builder
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully
    command: sh -lc "/app/node_modules/.bin/tsx prisma/seed.ts"
    restart: "no"

  api:
    build: ./backend
    command: yarn dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NODE_ENV: development
      FIREBASE_SERVICE_ACCOUNT_B64: ${FIREBASE_SERVICE_ACCOUNT_B64}
    depends_on:
      db:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully

  studio:
    build: ./backend
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: development
      FIREBASE_SERVICE_ACCOUNT_B64: ${FIREBASE_SERVICE_ACCOUNT_B64}
    depends_on:
      db:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully
    ports:
      - "5556:5556"
    command: sh -lc 'until pg_isready -h db -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 1; done; exec ./node_modules/.bin/prisma studio --port 5556 --browser none --url "$DATABASE_URL"'
    restart: "no"

  migrate-dev:
    build:
      context: ./backend
      target: builder
    volumes:
      - ./backend/prisma:/app/prisma
    env_file:
      - .env
    environment:
      - MIGRATION_NAME
    depends_on:
      db:
        condition: service_healthy
    command: sh -lc 'until pg_isready -h db -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 1; done; yarn prisma migrate dev --name "${MIGRATION_NAME:-init}"'
    restart: "no"

  frontend:
    build:
        context: ./frontend
        args:
          NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
        - "3001:3001"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
        - api
    environment:
        PORT: 3001
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

  api-test:
    build: ./backend
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/tests:/app/tests
      - ./backend/jest.config.cjs:/app/jest.config.cjs
      - ./backend/tsconfig.build.json:/app/tsconfig.build.json
      - ./backend/tests/jest.setup.ts:/app/tests/jest.setup.ts
      - ./backend/.env.test:/app/.env.test
    env_file:
      - ./backend/.env.test
    environment:
      NODE_ENV: test
    depends_on:
      db:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully
    command: sh -lc "yarn jest --config /app/jest.config.cjs --runInBand --detectOpenHandles"

  # db-test:
    # image: postgres:15-alpine
    # environment:
    #   POSTGRES_USER: ${POSTGRES_TEST_USER:-postgres}
    #   POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-password}
    #   POSTGRES_DB: ${POSTGRES_TEST_DB:-driving_tracker_test}
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-driving_tracker_test}"]
    #   interval: 3s
    #   timeout: 3s
    #   retries: 10

  prisma-migrate-test:
    build:
      context: ./backend
      target: builder
    env_file:
      - ./backend/.env.test
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    command: sh -lc "yarn prisma:migrate:deploy && yarn prisma:generate"
    restart: "no"

  seed-test:
    build: 
      context: ./backend
      target: builder
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    env_file:
      - ./backend/.env.test
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: test
    depends_on:
      db:
        condition: service_healthy
      prisma-migrate-test:
        condition: service_completed_successfully
    command: sh -c "npx tsx prisma/seed.ts"
    restart: "no"

  api-nfr:
    build: ./backend
    command: yarn start
    env_file:
      - ./backend/.env.test
    environment:
      NODE_ENV: test
      DISABLE_RATE_LIMIT: "true"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-testsecret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-testrefreshsecret}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/auth/register', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      prisma-migrate-test:
        condition: service_completed_successfully
      seed-test:
        condition: service_completed_successfully

  k6:
    image: grafana/k6:latest
    volumes:
      - ./load-tests:/app
    environment:
      - API_URL=http://api-nfr:3000
    depends_on:
      api-nfr:
        condition: service_healthy
    command: run /app/trips.k6.ts

volumes:
  postgres_data:
