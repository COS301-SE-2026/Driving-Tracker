name: Deploy to Azure App Service

on:
  push:
    branches:
      - main

env:
  IMAGE_TAG: ${{ github.sha }}
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login $REGISTRY \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG .

      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG

      # Save currently deployed image 
      - name: Save current image
        id: previous
        run: |
          CURRENT_IMAGE=$(az webapp config container show \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --query dockerCustomImageName \
            -o tsv)

          echo "Current image: $CURRENT_IMAGE"
          echo "previous_image=$CURRENT_IMAGE" >> "$GITHUB_OUTPUT"

      
      # Deploy new image
      - name: Deploy image
        run: |
          az webapp config container set \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --container-image-name $REGISTRY/$IMAGE_NAME:$IMAGE_TAG \
            --container-registry-url https://$REGISTRY \
            --container-registry-user "${{ secrets.ACR_USERNAME }}" \
            --container-registry-password "${{ secrets.ACR_PASSWORD }}"

      - name: Restart App Service
        run: |
          az webapp restart \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}"

      - name: Wait for application
        run: sleep 45

      - name: Health Check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/health)

          echo "Status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            exit 1
          fi

      # Automatic rollback
      - name: Roll back
        if: failure()
        run: |
          echo "Rolling back to:"
          echo "${{ steps.previous.outputs.previous_image }}"

          az webapp config container set \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --container-image-name "${{ steps.previous.outputs.previous_image }}" \
            --container-registry-url https://$REGISTRY \
            --container-registry-user "${{ secrets.ACR_USERNAME }}" \
            --container-registry-password "${{ secrets.ACR_PASSWORD }}"

          az webapp restart \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}"
