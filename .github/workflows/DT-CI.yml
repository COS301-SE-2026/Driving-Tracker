name: CI

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      #Prisma v7 config expects DATABASE_URL to exist, uses dummy
      DATABASE_URL: postgresql://ci_user:ci_pass@localhost:5432/driving_tracker_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Create Firebase service account file
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > ./drivingtracker-84d58-firebase-adminsdk-fbsvc-5b11b15155.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - run: corepack enable
      - run: corepack prepare yarn@4.6.0 --activate
      - run: yarn install --immutable
      - run: yarn prisma:generate
      - run: yarn build
      - run: yarn test
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services: 
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: driving_tracker_ci
        ports:
        - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env: 
      DATABASE_URL: postgresql://ci_user:${{ secrets.CI_DB_PASSWORD || 'ci_pass' }}@localhost:5432/driving_tracker_ci?schema=public
      JWT_SECRET: ci-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      NODE_ENV: test
      TEST_USER_PASSWORD: Password123!

    steps:
      - uses: actions/checkout@v4

      - name: Create Firebase service account file
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > ./drivingtracker-84d58-firebase-adminsdk-fbsvc-5b11b15155.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - run: corepack enable
      - run: corepack prepare yarn@4.6.0 --activate
      - run: yarn install --immutable
      - run: yarn prisma:generate

      - run: yarn prisma migrate deploy

      - run: yarn test:integration
  
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
        
      - run: corepack enable
      - run: corepack prepare yarn@4.14.1 --activate
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build

  docker-smoke:
    runs-on: ubuntu-latest
    env:
      #CI-only postgres creds 
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_pass
      POSTGRES_DB: driving_tracker_ci

      DATABASE_URL: postgresql://ci_user:ci_pass@db:5432/driving_tracker_ci?schema=public

      #CI-only JWT
      JWT_SECRET: ci-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      #azuremaps
      AZURE_MAPS_SUBSCRIPTION_KEY: ci-maps-token
      NEXT_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Create Firebase service account file
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p backend
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > ./backend/drivingtracker-84d58-firebase-adminsdk-fbsvc-5b11b15155.json

      - name: Create .env for docker compose
        run: |
          cat > .env <<EOF
          POSTGRES_USER=${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ env.POSTGRES_DB }}
          DATABASE_URL=${{ env.DATABASE_URL }}
          JWT_SECRET=${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ env.JWT_REFRESH_SECRET }}
          NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          AZURE_MAPS_SUBSCRIPTION_KEY=${{ env.AZURE_MAPS_SUBSCRIPTION_KEY}}
          EOF

            mkdir -p backend
            cat > backend/.env <<EOF
            DATABASE_URL=${{ env.DATABASE_URL }}
            SEED_USER_PASSWORD=ci-seed-password
            AZURE_MAPS_SUBSCRIPTION_KEY=${{ env.AZURE_MAPS_SUBSCRIPTION_KEY}}
            EOF

      - run: docker compose build
      - run: docker compose up -d

      - name: Wait for API /health
        run: |
          for i in {1..15}; do
            curl -fsS http://localhost:3000/health && exit 0
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - if: always()
        run: docker compose down -v

  android-unit: 
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          sdkmanager --install "platform-tools" "platforms;android-36"

          for bt in 36.0.1 36.0.0 35.0.1 35.0.0 34.0.0; do
            if sdkmanager --install "build-tools;${bt}"; then
              exit 0
            fi
          done

          echo "Failed to install Android build-tools" >&2
          exit 1
          
      - run: chmod +x ./gradlew
      - run: ./gradlew test --stacktrace
